<script type="module">
import * as THREE from 'three';
import { buildVilla, P, checkOpenings } from './src/model.js';
import { setupLights } from './src/core.js';

/* ================= 渲染器 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;      // 静态场景：阴影只烘一次 → 省一整趟渲染
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// 太阳放在西南上空（对应默认机位 theta≈-0.86 的方向），让可见立面与地面都受光
// 太阳：南偏东 30°、仰角 40° —— 初始机位在西南，南立面受光、西立面落影，
// 投影落到画面前方，360° 环绕时四个面都有明确的明暗关系（角度按「度」传入）。
setupLights(scene, { background: false, shadowSpan: 22, shadowMap: 4096, sunI: 2.85, hemiI: 0.58, envI: 0.62, sunAz: 30, sunEl: 40 });
// 背景用柔和冷灰，不用环境贴图（环境贴图当地平线会出现军绿色带）
scene.background = new THREE.Color(0xe8ecf1);

/* ================= 模型 ================= */
const { root: villa, parts } = buildVilla(scene);
// 调试：?audit=1 输出各立面外挂构件清单（写入 title，供无头浏览器读取）
if (new URLSearchParams(location.search).get('ovl')) {
  const bad = checkOpenings();
  // 大面构件清单（找出意外的大色块）
  if (new URLSearchParams(location.search).get('big')) {
    out.length = 0;
    items.filter(o => (o.b.max.x - o.b.min.x) * (o.b.max.z - o.b.min.z) > 25)
      .sort((a, b2) => (b2.b.max.x - b2.b.min.x) * (b2.b.max.z - b2.b.min.z) - (a.b.max.x - a.b.min.x) * (a.b.max.z - a.b.min.z))
      .forEach(o => out.push(`${o.n}|dy${o.b.min.y.toFixed(3)}~${o.b.max.y.toFixed(3)}|${(o.b.max.x - o.b.min.x).toFixed(1)}x${(o.b.max.z - o.b.min.z).toFixed(1)}`));
  }
  const pre = document.createElement('pre');
  pre.id = 'auditOut';
  pre.textContent = bad.length ? bad.join('\n') : 'OK 无洞口重叠';
  document.body.appendChild(pre);
}
if (new URLSearchParams(location.search).get('audit')) {
  villa.updateMatrixWorld(true);
  const items = [];
  villa.traverse(o => {
    if (!o.isMesh) return;
    const b = new THREE.Box3().setFromObject(o);
    if (!isFinite(b.min.x)) return;
    items.push({ n: o.name || '(未命名)', b, tri: (o.geometry?.index?.count || 0) / 3 });
  });
  const groups = {
    '北外挂(z<-6, |x|<15)': items.filter(o => o.b.max.z <= -5.99 && o.b.min.y < 8.2 && o.b.min.x > -15.2),
    '东外挂(x>9)': items.filter(o => o.b.min.x >= 8.99 && o.b.min.y < 8.2),
    '南外挂(z>6)': items.filter(o => o.b.min.z >= 5.99 && o.b.min.y < 8.2),
    '西外挂(x<-9)': items.filter(o => o.b.max.x <= -8.99 && o.b.min.y < 8.2),
  };
  const out = [];
  for (const [k, arr] of Object.entries(groups)) {
    out.push('[' + k + ' n=' + arr.length + ']');
    arr.sort((a, b2) => a.b.min.y - b2.b.min.y || a.b.min.x - b2.b.min.x)
      .forEach(o => out.push(`${o.n}|x${o.b.min.x.toFixed(2)}~${o.b.max.x.toFixed(2)}|y${o.b.min.y.toFixed(2)}~${o.b.max.y.toFixed(2)}|z${o.b.min.z.toFixed(2)}~${o.b.max.z.toFixed(2)}`));
  }
  // 额外：列出与指定盒体相交的构件
  const qb = new URLSearchParams(location.search).get('box');
  if (qb) {
    const [x0,x1,y0,y1,z0,z1] = qb.split(',').map(Number);
    const BB = new THREE.Box3(new THREE.Vector3(x0,y0,z0), new THREE.Vector3(x1,y1,z1));
    out.length = 0;
    items.filter(o => o.b.intersectsBox(BB)).forEach(o => out.push(`${o.n}|x${o.b.min.x.toFixed(2)}~${o.b.max.x.toFixed(2)}|y${o.b.min.y.toFixed(2)}~${o.b.max.y.toFixed(2)}|z${o.b.min.z.toFixed(2)}~${o.b.max.z.toFixed(2)}`));
  }
  // 大面构件清单（找出意外的大色块）
  if (new URLSearchParams(location.search).get('big')) {
    out.length = 0;
    items.filter(o => (o.b.max.x - o.b.min.x) * (o.b.max.z - o.b.min.z) > 25)
      .sort((a, b2) => (b2.b.max.x - b2.b.min.x) * (b2.b.max.z - b2.b.min.z) - (a.b.max.x - a.b.min.x) * (a.b.max.z - a.b.min.z))
      .forEach(o => out.push(`${o.n}|dy${o.b.min.y.toFixed(3)}~${o.b.max.y.toFixed(3)}|${(o.b.max.x - o.b.min.x).toFixed(1)}x${(o.b.max.z - o.b.min.z).toFixed(1)}`));
  }
  const pre = document.createElement('pre');
  pre.id = 'auditOut';
  pre.textContent = out.join('\n');
  document.body.appendChild(pre);
  document.title = 'AUDIT-DONE n=' + out.length;
}

/* ================= 相机 ================= */
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.08, 400);

// —— 环绕（球坐标）——
const orbit = {
  theta: -0.86, phi: 1.24, dist: 34,
  thetaT: -0.86, phiT: 1.24, distT: 31,
  target: new THREE.Vector3(-2.0, 3.4, 0.4),
  targetT: new THREE.Vector3(-2.0, 3.4, 0.4),
};
// —— 漫游（第一人称）——
const walk = {
  pos: new THREE.Vector3(-2.0, 1.68, 14.0),
  yaw: Math.PI, pitch: -0.06,
  yawT: Math.PI, pitchT: -0.06,
  vel: new THREE.Vector3(),
};
let mode = 'orbit';

const m = P.main, gr = P.garage;
const SOLIDS = [
  { x0: m.x0 - 0.55, x1: m.x1 + 0.55, z0: m.z0 - 0.55, z1: m.z1 + P.cant.south + 0.55 },
  { x0: gr.x0 - 0.55, x1: gr.x1 + 0.55, z0: gr.z0 - 0.55, z1: gr.z1 + 0.55 },
];
const inSolid = (x, z) => SOLIDS.some(s => x > s.x0 && x < s.x1 && z > s.z0 && z < s.z1);

function applyCamera() {
  if (mode === 'orbit') {
    const s = Math.sin(orbit.phi), c = Math.cos(orbit.phi);
    camera.position.set(
      orbit.target.x + orbit.dist * s * Math.sin(orbit.theta),
      orbit.target.y + orbit.dist * c,
      orbit.target.z + orbit.dist * s * Math.cos(orbit.theta),
    );
    camera.lookAt(orbit.target);
  } else {
    camera.position.copy(walk.pos);
    camera.rotation.set(0, 0, 0);
    camera.rotateY(walk.yaw);
    camera.rotateX(walk.pitch);
  }
}

/* ================= 交互 =================
   单指：旋转（轨道）/ 转头（漫游）
   双指：捏合缩放 + 双指拖动平移（仅轨道模式；手机上看门窗靠这个）
   右键/Shift：平移；滚轮：缩放 */
let drag = null;
const cv = renderer.domElement;
const ptrs = new Map();          // 多指追踪：pointerId -> {x,y}
let pinch = null;                // 双指状态：{dist, mx, my}
cv.addEventListener('contextmenu', e => e.preventDefault());

const beginDrag = (x, y, btn, shift) => { drag = { x, y, btn, shift, moved: 0 }; };

cv.addEventListener('pointerdown', (e) => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) {
    drag = null;                 // 第二根手指按下 → 转入双指手势，取消单指旋转
    const [a, b] = [...ptrs.values()];
    pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
  } else if (ptrs.size === 1) {
    beginDrag(e.clientX, e.clientY, e.button, e.shiftKey);
  }
});

cv.addEventListener('pointermove', (e) => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

  // —— 双指：捏合缩放 + 平移（仅轨道模式）——
  if (ptrs.size >= 2 && pinch && mode === 'orbit') {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    orbit.distT = Math.max(2.2, Math.min(120, orbit.distT * (pinch.dist / d)));
    const k = orbit.dist * 0.0016;
    const right = new THREE.Vector3(Math.cos(orbit.theta), 0, -Math.sin(orbit.theta));
    const fwd = new THREE.Vector3(Math.sin(orbit.theta), 0, Math.cos(orbit.theta));
    orbit.targetT.addScaledVector(right, -(mx - pinch.mx) * k).addScaledVector(fwd, -(my - pinch.my) * k);
    orbit.targetT.y = Math.max(0.2, Math.min(9, orbit.targetT.y));
    pinch.dist = d; pinch.mx = mx; pinch.my = my;
    return;
  }

  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    drag.x = e.clientX; drag.y = e.clientY;
    if (mode === 'orbit') {
      if (drag.btn === 2 || drag.shift) {
        // 平移
        const k = orbit.dist * 0.0016;
        const right = new THREE.Vector3(Math.cos(orbit.theta), 0, -Math.sin(orbit.theta));
        const fwd = new THREE.Vector3(Math.sin(orbit.theta), 0, Math.cos(orbit.theta));
        orbit.targetT.addScaledVector(right, -dx * k).addScaledVector(fwd, -dy * k);
        orbit.targetT.y = Math.max(0.2, Math.min(9, orbit.targetT.y));
      } else {
        orbit.thetaT -= dx * 0.0052;
        orbit.phiT = Math.max(0.16, Math.min(1.50, orbit.phiT - dy * 0.0045));
      }
    } else {
      walk.yawT -= dx * 0.0042;
      walk.pitchT = Math.max(-1.1, Math.min(0.9, walk.pitchT - dy * 0.0035));
    }
  } else if (mode === 'orbit') {
    hover(e.clientX, e.clientY);
  }
});

cv.addEventListener('pointerup', (e) => {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (drag && drag.moved < 6) pick(e.clientX, e.clientY);
  drag = null;
  // 双指抬起一根后，剩下那根继续可以旋转
  if (ptrs.size === 1) {
    const p = [...ptrs.values()][0];
    beginDrag(p.x, p.y, 0, false);
  }
});
cv.addEventListener('pointercancel', (e) => {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  drag = null;
});
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (mode === 'orbit') {
    orbit.distT = Math.max(2.2, Math.min(120, orbit.distT * (1 + Math.sign(e.deltaY) * 0.11)));
  } else {
    walk.pos.y = Math.max(0.9, Math.min(6.5, walk.pos.y - Math.sign(e.deltaY) * 0.22));
  }
}, { passive: false });

// 键盘（漫游）
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyF') setMode(mode === 'orbit' ? 'walk' : 'orbit'); });
addEventListener('keyup', e => { keys[e.code] = false; });

function walkStep(dt) {
  const sp = (keys.ShiftLeft || keys.ShiftRight ? 6.2 : 2.6) * dt;
  const fwd = new THREE.Vector3(-Math.sin(walk.yaw), 0, -Math.cos(walk.yaw));
  const right = new THREE.Vector3(Math.cos(walk.yaw), 0, -Math.sin(walk.yaw));
  const mv = new THREE.Vector3();
  if (keys.KeyW || keys.ArrowUp) mv.add(fwd);
  if (keys.KeyS || keys.ArrowDown) mv.sub(fwd);
  if (keys.KeyA || keys.ArrowLeft) mv.sub(right);
  if (keys.KeyD || keys.ArrowRight) mv.add(right);
  if (mv.lengthSq() < 1e-6) return;
  mv.normalize().multiplyScalar(sp);
  // 分轴推进，允许沿墙滑行，禁止穿墙
  const nx = walk.pos.x + mv.x, nz = walk.pos.z + mv.z;
  if (!inSolid(nx, walk.pos.z)) walk.pos.x = Math.max(-26, Math.min(26, nx));
  if (!inSolid(walk.pos.x, nz)) walk.pos.z = Math.max(-22, Math.min(26, nz));
}

/* ================= 构件拾取 ================= */
const ray = new THREE.Raycaster();
const UNIT = () => new THREE.Box3(new THREE.Vector3(-1, -1, -1), new THREE.Vector3(1, 1, 1));
const hlBox = new THREE.Box3Helper(UNIT(), 0x4fd39a);
hlBox.visible = false;
scene.add(hlBox);
const selBox = new THREE.Box3Helper(UNIT(), 0xffc247);
selBox.visible = false;
scene.add(selBox);

function groupOf(obj) {
  let o = obj;
  while (o) {
    if (o.userData && o.userData.info) return o;
    o = o.parent;
  }
  return null;
}
function castAt(x, y) {
  ray.setFromCamera(new THREE.Vector2(
    (x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1), camera);
  const hits = ray.intersectObject(villa, true);
  for (const h of hits) {
    if (!h.object.visible) continue;
    const g = groupOf(h.object);
    if (g) return g;
  }
  return null;
}
function hover(x, y) {
  const g = castAt(x, y);
  const el = document.getElementById('hoverName');
  if (g) {
    hlBox.box.copy(new THREE.Box3().setFromObject(g));
    hlBox.visible = true;
    el.textContent = g.userData.info.name;
    el.style.left = (x + 14) + 'px';
    el.style.top = (y + 14) + 'px';
    el.classList.add('show');
  } else {
    hlBox.visible = false;
    el.classList.remove('show');
  }
}
function pick(x, y) {
  if (mode === 'walk') { x = innerWidth / 2; y = innerHeight / 2; }
  const g = castAt(x, y);
  if (!g) { selBox.visible = false; document.getElementById('card').classList.remove('show'); return; }
  const i = g.userData.info;
  selBox.box.copy(new THREE.Box3().setFromObject(g));
  selBox.visible = true;
  document.getElementById('cName').textContent = i.name;
  document.getElementById('cSize').textContent = i.size;
  document.getElementById('cMat').textContent = i.mat;
  document.getElementById('cNote').textContent = i.note || '—';
  const sim = document.getElementById('cSim');
  sim.textContent = i.simple ? '简化：' + i.simple : '';
  sim.style.display = i.simple ? 'block' : 'none';
  document.getElementById('card').classList.add('show');
}
document.getElementById('cardClose').onclick = () => {
  document.getElementById('card').classList.remove('show');
  selBox.visible = false;
};

/* ================= 预设视点（可近距离看门窗雨棚） ================= */
const VS = [
  { t: [-3.4, 3.0, -0.6], th: -0.86, ph: 1.22, d: 31 },
  { t: [0.0, 2.0, 7.2], th: -0.42, ph: 1.16, d: 9.0 },
  { t: [-5.2, 1.8, 6.2], th: -0.20, ph: 1.24, d: 7.5 },
  { t: [-4.8, 5.8, 8.0], th: -0.30, ph: 1.10, d: 7.0 },
  { t: [-14.4, 1.6, -2.5], th: -1.62, ph: 1.22, d: 8.5 },
  { t: [-12.2, 4.5, -3.0], th: -1.30, ph: 1.14, d: 7.5 },
  { t: [0.0, 7.6, 0.6], th: -0.90, ph: 0.62, d: 17 },
];
function goto(i, instant) {
  const v = VS[i];
  setMode('orbit');
  orbit.targetT.set(v.t[0], v.t[1], v.t[2]);
  orbit.thetaT = v.th; orbit.phiT = v.ph; orbit.distT = v.d;
  if (instant) {
    orbit.target.copy(orbit.targetT);
    orbit.theta = v.th; orbit.phi = v.ph; orbit.dist = v.d;
  }
}
document.querySelectorAll('.views button').forEach(b => {
  b.onclick = () => goto(+b.dataset.v, false);
});
const qv = new URLSearchParams(location.search).get('v');
// 调试：?cam=theta,phi,dist,tx,ty,tz 直接指定机位（不写入发布版 UI）
const qcam = new URLSearchParams(location.search).get('cam');
if (qcam) {
  const a = qcam.split(',').map(Number);
  if (a.length === 6 && a.every(n => Number.isFinite(n))) {
    orbit.target.set(a[3], a[4], a[5]);
    orbit.targetT.copy(orbit.target);
    orbit.theta = orbit.thetaT = a[0];
    orbit.phi = orbit.phiT = a[1];
    orbit.dist = orbit.distT = a[2];
  }
}

/* ================= 模式 ================= */
const bO = document.getElementById('mOrbit'), bW = document.getElementById('mWalk');
function setMode(mo) {
  mode = mo;
  bO.classList.toggle('on', mo === 'orbit');
  bW.classList.toggle('on', mo === 'walk');
  document.getElementById('cross').classList.toggle('show', mo === 'walk');
  hlBox.visible = false;
  document.getElementById('hoverName').classList.remove('show');
  if (mo === 'walk') {
    // 从当前机位落到地面，朝向建筑
    walk.pos.set(camera.position.x, 1.68, camera.position.z);
    if (inSolid(walk.pos.x, walk.pos.z)) walk.pos.set(walk.pos.x, 1.68, m.z1 + 4.5);
    walk.yaw = walk.yawT = Math.atan2(
      -(-2.0 - walk.pos.x), -(0.4 - walk.pos.z));
    walk.pitch = walk.pitchT = -0.04;
  }
}
bO.onclick = () => setMode('orbit');
bW.onclick = () => setMode('walk');
// ?v=N 直达预设视点（截图 / 分享用）
if (qv !== null && VS[+qv]) goto(+qv, true);

/* ================= 主循环 ================= */
const stat = document.getElementById('stat');
let last = performance.now(), frames = 0, acc = 0;

function updateStat(fps) {
  const inf = renderer.info;
  stat.innerHTML =
    `${fps ? fps.toFixed(0) + ' FPS　·　' : ''}DrawCall ${inf.render.calls}　·　三角面 ${(inf.render.triangles / 1000).toFixed(0)}k<br>`
    + `可拾取构件 ${parts.length} 项　·　贴图仅 2 张（光伏 / 门牌）　·　静态阴影单次烘焙`;
}

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (mode === 'orbit') {
    const k = 1 - Math.pow(0.0016, dt);
    orbit.theta += (orbit.thetaT - orbit.theta) * k;
    orbit.phi += (orbit.phiT - orbit.phi) * k;
    orbit.dist += (orbit.distT - orbit.dist) * k;
    orbit.target.lerp(orbit.targetT, k);
  } else {
    walkStep(dt);
    const k = 1 - Math.pow(0.0008, dt);
    walk.yaw += (walk.yawT - walk.yaw) * k;
    walk.pitch += (walk.pitchT - walk.pitch) * k;
  }
  applyCamera();
  renderer.render(scene, camera);

  acc += dt; frames++;
  if (acc > 0.25) { updateStat(frames / acc); acc = 0; frames = 0; }
  requestAnimationFrame(loop);
}
// 首帧：烘焙静态阴影并出一次统计
renderer.shadowMap.needsUpdate = true;
applyCamera();
renderer.render(scene, camera);
updateStat(0);
requestAnimationFrame(loop);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.needsUpdate = true;
});
window.__ready = true;
</script>
