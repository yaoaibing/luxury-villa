<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>别墅立面核验</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#eef1f5;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
  canvas { display:block; }
  .hd  { position:fixed; left:18px; top:15px; font-size:20px; font-weight:700; color:#182430; }
  .sub { position:fixed; left:18px; top:43px; font-size:13px; color:#5f6b7a; }
  .mk { position:fixed; pointer-events:none; }
  .num { width:23px; height:23px; border-radius:50%; background:#1f7a5a; color:#fff;
    font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 5px rgba(0,0,0,.28); }
  .num.q { background:#c8862a; }
  .txt { position:absolute; left:28px; top:-3px; background:rgba(255,255,255,.97);
    border:1px solid #1f7a5a; border-left-width:3px; color:#1d2530; font-size:12.5px;
    line-height:1.45; padding:5px 9px; width:max-content; max-width:230px;
    white-space:normal; border-radius:3px; box-shadow:0 2px 8px rgba(0,0,0,.12); }
  .txt.q { border-color:#c8862a; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<div class="hd" id="hd"></div><div class="sub" id="sub"></div>
<script type="module">
import * as THREE from 'three';
import { buildVilla, P } from './src/model.js';
import { setupLights } from './src/core.js';

const q = new URLSearchParams(location.search);
const view = q.get('view') || 'south';
const mark = q.get('mark') !== '0';

/* ---------------- 渲染器 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   // 静态场景：只烘一次阴影
// 调试：?noshadow=1 关掉阴影，用来判断画面里的「线」是几何还是投影
const NO_SHADOW = q.get('noshadow') === '1';
if (NO_SHADOW) renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f5);

/* ---------------- PBR 光照 + 程序化天空环境 ----------------
   立面核对时，太阳必须照在所看的那一面：各视图给各自的方位角，
   否则背光面的墙与地面全落在阴影里，看不出材质与构造。
------------------------------------------------------------------ */
const SUN_AZ = {
  south: 172, north: 352, east: 80, west: 260, roof: 150, persp: 20,
}[view] ?? 128;
// 俯视时屋面直接正对太阳，强度要单独压低，否则一片死白
const isRoof = view === 'roof';
setupLights(scene, {
  background: false, shadowSpan: 22, shadowMap: 4096,
  sunI: isRoof ? 2.35 : 3.0, hemiI: isRoof ? 0.42 : 0.46, envI: isRoof ? 0.40 : 0.50,
  sunAz: SUN_AZ, sunEl: isRoof ? 62 : 38,
});

/* ---------------- 模型 ---------------- */
const { root: villa } = buildVilla(scene);

// 调试：?hide=组名1,组名2 临时隐藏构件（定位「画面里这条线是谁」）
const hideList = (q.get('hide') || '').split(',').filter(Boolean);
hideList.forEach((n) => {
  const o = villa.getObjectByName(n);
  if (o) o.visible = false;
});

/* 图纸视图按面剔除：
   ① 垂直于本立面的外挂构件（东向遮阳及其拉杆）从南/北看只剩轮廓外一条斜杆，
      会读成「悬空构件」，故不画；
   ② 屋顶平面只画屋面本身，场地铺装不参与（否则整片地面把画面填满）。 */
if (view === 'south' || view === 'north') {
  villa.traverse((o) => {
    if (o.userData.docHide && o.userData.docHide.includes(view)) o.visible = false;
  });
}
if (view === 'roof') {
  // 屋顶平面按「屋面以上」出图：场地、散水沟、台阶、门廊、贴墙五金都在
  // 剖切线以下，保留会在纸面上留下一圈浮空小块。
  [
    '场地地坪', '场地铺装', '简化五金',
    '散水排水沟(主楼段)', '散水排水沟(车库段)',
    '主入口门廊', '露台踏步',
  ].forEach((n) => {
    const o = villa.getObjectByName(n);
    if (o) o.visible = false;
  });
}

/* ---------------- 相机：正交五视图 ---------------- */
const m = P.main, gr = P.garage;
const BB = { x0: gr.x0, x1: m.x1, z0: m.z0, z1: m.z1 + P.cant.south, y1: P.main.para };
const need = {
  south: { w: BB.x1 - BB.x0, h: BB.y1 },
  north: { w: BB.x1 - BB.x0, h: BB.y1 },
  east:  { w: BB.z1 - BB.z0, h: BB.y1 },
  west:  { w: BB.z1 - BB.z0, h: BB.y1 },
  roof:  { w: BB.x1 - BB.x0, d: BB.z1 - BB.z0 },
};

const aspect = innerWidth / innerHeight;
let camera;
if (view === 'persp') {
  camera = new THREE.PerspectiveCamera(36, aspect, 0.5, 300);
  camera.position.set(-21.5, 13.2, 24.5);
  camera.lookAt(-2.6, 3.4, 0.2);
} else {
  const zm = parseFloat(q.get('zoom') || '1');   // 局部精修核对用：zoom<1 放大
  const pad = (view === 'roof' ? 1.10 : 1.24) * zm;
  const fw = view === 'roof' ? need.roof.w * pad : need[view].w * pad;
  const fh = view === 'roof' ? need.roof.d * pad : need[view].h * pad;
  let s = fh;
  if (fw / fh > aspect) s = fw / aspect;
  // near 必须为正：负 near 会让相机把建筑背后的构件（对侧遮阳拉杆等）也画出来，
  // 表现为轮廓外悬空的斜杆。相机距中心 70，取 near 1 / far 200 足够。
  camera = new THREE.OrthographicCamera(-s * aspect / 2, s * aspect / 2, s / 2, -s / 2, 1, 200);
  const cx = (BB.x0 + BB.x1) / 2, cz = (BB.z0 + BB.z1) / 2;
  const cy = view === 'roof' ? 0 : BB.y1 / 2;
  const dist = 70;
  const set = {
    south: [cx, cy, dist], north: [cx, cy, -dist],
    east:  [dist, cy, cz], west:  [-dist, cy, cz],
    roof:  [cx, dist, cz],
  }[view];
  camera.position.set(...set);
  camera.up.set(0, view === 'roof' ? 0 : 1, view === 'roof' ? -1 : 0);
  camera.lookAt(cx, cy, cz);
  // 顶部标题区占约 88px：把正交视口整体下移，避免建筑顶部被标题压住
  const hPx = innerHeight, shiftPx = 44;
  const frac = (shiftPx * 2) / hPx;          // 世界单位换算：视口高 s 对应 hPx 像素
  camera.top += (s * frac) / 2;
  camera.bottom += (s * frac) / 2;
  // 局部核对：?px=&py= 按世界米数平移视口（配合 zoom 定位任意细部）
  const px = parseFloat(q.get('px') || '0'), py = parseFloat(q.get('py') || '0');
  if (px || py) {
    camera.left -= px; camera.right -= px;
    camera.top -= py; camera.bottom -= py;
  }
  camera.updateProjectionMatrix();
}

const names = {
  south: '南立面（主景观面 / 主入口）', north: '北立面（背面 / 服务入口）',
  east: '东立面', west: '西立面（车库面）', roof: '屋顶平面', persp: '体量透视',
};
document.getElementById('hd').textContent = names[view];
document.getElementById('sub').textContent =
  `正交投影 · 主楼 ${(m.x1 - m.x0).toFixed(1)}m ＋西车库 ${(m.x0 - gr.x0).toFixed(1)}m ＝总宽 ${(m.x1 - gr.x0).toFixed(1)}m · `
  + `一层 ${m.f1}m / 二层楼面 ${(m.f1 + m.slab).toFixed(2)}m / 女儿墙顶 ${m.para}m`;

/* ---------------- 逐面核对标注 ----------------
   绿色 = 本轮已处置；橙色 = 仍需你拍板
------------------------------------------------- */
const ZS = m.z1 + P.cant.south;
const MARKS = {
  south: [
    [[0, P.porch.clear + 0.2, 8.2], '入口雨棚净高已由 3.20 提到 3.60m，挑出 2.60m；下设 3 级台阶＋1.20m 平台。', 0],
    [[-5.0, 5.7, ZS + 0.2], '二层通长玻璃 16.8m 已分 5 段：4 根竖挺，每段 3.36m。', 0],
    [[-4.8, 6.4, ZS + 0.35], '木格栅已由 4.8m 扩至 7.2m（u −8.40~−1.20），带上下金属封边与 3 道背横梁。', 0],
    [[5.4, 0.30, m.z1 + 0.1], '落地窗台 0.30m；四周已设 0.70m 宽散水＋通长排水沟，室内外高差已处理。', 0],
    [[2.30, 2.20, m.z1 + 0.1], '入口门牌（唯一贴图之一，拉丝不锈钢阴刻）。', 1],
    [[-6.5, 1.8, m.z1 + 0.1], '石材为 3m 一开间真板缝（缝宽 30mm，缝内露出后退 8mm 的深色底板）。', 1],
  ],
  east: [
    [[m.x1 + 0.2, 3.6, 0], '层间墙已由 1.90m 减至 1.60m（一层窗顶 2.80 → 二层窗台 4.40）。', 0],
    [[m.x1 + 1.0, 6.62, 3.4], '东向遮阳挑檐已设：两段各 2.90m 长、挑出 0.90m，带封边与滴水；中部通高窗不遮挡。', 0],
    [[m.x0 + 0.12, 4.5, 0.2], '雨水立管已移至西南凹角（主楼西墙×车库南墙），不再挂在阳角。', 0],
    [[m.x1 + 0.2, 4.9, -0.0], '中部通高窗 1.40×2.60m，与两侧窗形成竖向节奏。', 1],
  ],
  north: [
    [[-3.5, 1.10, m.z0 - 0.2], '服务门已由 1.0m 加宽至 1.20m，门高 2.20m。', 0],
    [[5.4, 1.0, m.z0 - 0.9], '空调外机已加 3.20m 宽防雨百叶罩（12 片，倾角 32°）。', 0],
    [[-4.5, 2.2, m.z0 - 0.2], '高窗窗台已由 1.6m 下调至 1.50m。', 0],
    [[-11.4, 1.8, m.z0 - 0.2], '车库段另设 1.50m 通风百叶。', 1],
  ],
  west: [
    [[gr.x0 - 0.2, 1.4, -2.5], '卷帘门 5.00×2.80m（双车位），带门楣罩、导轨与 14 片叶片。', 0],
    [[gr.x0 - 0.2, 3.85, 0.1], '车库净高 3.60 与二层楼板底 3.90 的错台已补铝合金线脚收口。', 0],
    [[gr.x0 - 0.2, 4.5, -3.4], '车库顶做露台：3.90m 面层＋1.10m 玻璃栏板，二层有门直达。', 0],
    [[gr.x0 - 0.2, 6.6, -3.4], '二层通高窗 4.40~7.00m，位于露台上方主楼西墙。', 1],
    [[gr.x0 - 0.2, 1.9, -5.6], '门牌位置预留（车库西墙门侧）。', 1],
  ],
  roof: [
    [[0, m.para + 0.4, 0], 'BIPV 采光带 15.8×2.4m\n14 开间 / 透光 40%', 0],
    [[4.6, m.para + 0.4, 4.4], '南侧光伏 24 块\n3 排 × 8 列', 0],
    [[4.6, m.para + 0.4, -4.4], '北侧光伏 18 块\n3 排 × 6 列', 0],
    [[-5.9, m.para + 0.4, -4.6], '热泵 2 台\n共用基础', 0],
    [[-5.9, m.para + 0.3, -3.2], '检修走道 1.1m', 1],
  ],

};

if (view === 'roof') document.body.classList.add('roofview');
if (mark && MARKS[view]) {
  camera.updateMatrixWorld();
  camera.updateProjectionMatrix();
  MARKS[view].forEach(([p, text, kind], i) => {
    const v = new THREE.Vector3(p[0], p[1], p[2]).project(camera);
    const x = (v.x * 0.5 + 0.5) * innerWidth;
    const y = (-v.y * 0.5 + 0.5) * innerHeight;
    const d = document.createElement('div');
    d.className = 'mk';
    d.style.left = x + 'px'; d.style.top = y + 'px';
    d.innerHTML = `<div class="num${kind ? ' q' : ''}">${i + 1}</div>`
      + `<div class="txt${kind ? ' q' : ''}">${text}</div>`;
    document.body.appendChild(d);
  });
}

renderer.render(scene, camera);
renderer.shadowMap.needsUpdate = true;
renderer.render(scene, camera);

/* ---------------- 探针：?probe=屏x,屏y ----------------
   在指定像素打一条射线，把命中的构件链名写进 title 与 pre#probeOut。
   用来定位「画面里这条线/这块面到底是谁」，比肉眼猜快得多。 */
const probe = q.get('probe');
if (probe) {
  const [px, py] = probe.split(',').map(Number);
  const ndc = new THREE.Vector2(px / innerWidth * 2 - 1, -(py / innerHeight) * 2 + 1);
  const rc = new THREE.Raycaster();
  rc.setFromCamera(ndc, camera);
  const hits = rc.intersectObject(villa, true).slice(0, 8).map((h) => {
    const chain = [];
    let o = h.object;
    while (o) { if (o.name) chain.unshift(o.name); o = o.parent; }
    return `${h.distance.toFixed(2)}m  ${chain.join(' / ') || '(未命名)'}  `
      + `@${h.point.x.toFixed(2)},${h.point.y.toFixed(2)},${h.point.z.toFixed(2)}`;
  });
  const pre = document.createElement('pre');
  pre.id = 'probeOut';
  pre.textContent = hits.length ? hits.join('\n') : '无命中';
  document.body.appendChild(pre);
  document.title = 'PROBE ' + (hits[0] || 'none');
}
window.__ready = true;
</script>
</body>
</html>
